name: Gerar APK Debug (INVEST AI)

on:
  push:
    branches:3
      - main
      - master
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Compilar app-debug.apk
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restaurar debug.keystore do projeto
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Gerar APK de Debug
        run: gradle :app:assembleDebug --no-daemon

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: invest-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
